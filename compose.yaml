# Local development services. Only PostgreSQL runs in a container; the API and the
# web app run directly on your machine (see docs/development.md).
#
#   cp .env.example .env        # then set POSTGRES_PASSWORD
#   docker compose up -d --wait # starts PostgreSQL and waits until it is healthy
#   docker compose down         # stops it (add --volumes to delete the data)
name: milk-manager

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-milkmanager}
      POSTGRES_USER: ${POSTGRES_USER:-milkmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      # Bound to localhost only, so the database is not reachable from other machines.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
