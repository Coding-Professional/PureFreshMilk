name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (routes, 360px overflow, accessibility, Today flow)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  api:
    name: API — format, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Any 10.0.x SDK satisfies backend/global.json (10.0.100, rollForward latestFeature).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore PureFreshMilk.slnx
      - run: dotnet format PureFreshMilk.slnx --verify-no-changes --no-restore
      # Directory.Build.props sets TreatWarningsAsErrors, so warnings fail the build.
      - run: dotnet build PureFreshMilk.slnx --configuration Release --no-restore
      # Tests that need PostgreSQL are tagged Category=Database and run in the database job. The test
      # project that holds only those is left with no tests, which ends with exit code 8 ("zero tests ran").
      - run: dotnet test --solution PureFreshMilk.slnx --configuration Release --no-build --filter-not-trait "Category=Database" --ignore-exit-code 8

  database:
    name: Database — Compose PostgreSQL + API readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Throwaway container that lives only for this job; not a secret.
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Start PostgreSQL
        run: docker compose up --detach --wait

      - name: Build API
        working-directory: backend
        run: dotnet build src/PureFreshMilk.Api --configuration Release

      - name: Apply the migrations to the empty database
        working-directory: backend
        env:
          ConnectionStrings__PureFreshMilk: Host=localhost;Port=5432;Database=purefreshmilk;Username=purefreshmilk;Password=${{ env.POSTGRES_PASSWORD }}
        run: |
          dotnet tool restore
          dotnet ef database update --project src/PureFreshMilk.Infrastructure --startup-project src/PureFreshMilk.Api --configuration Release --no-build

      - name: Database tests (a throwaway database per test class, built from the migrations)
        working-directory: backend
        env:
          ConnectionStrings__PureFreshMilkTests: Host=localhost;Port=5432;Database=purefreshmilk;Username=purefreshmilk;Password=${{ env.POSTGRES_PASSWORD }}
        run: dotnet test --project tests/PureFreshMilk.Infrastructure.Tests --configuration Release

      - name: Start the API, wait until /health/ready is healthy, then smoke-test the data endpoints
        working-directory: backend
        env:
          ConnectionStrings__PureFreshMilk: Host=localhost;Port=5432;Database=purefreshmilk;Username=purefreshmilk;Password=${{ env.POSTGRES_PASSWORD }}
          ASPNETCORE_URLS: http://127.0.0.1:5080
          # The data endpoints exist outside Development only when switched on, until authentication exists.
          Access__AllowUnauthenticated: "true"
        run: |
          dotnet run --project src/PureFreshMilk.Api --configuration Release --no-build --no-launch-profile > api.log 2>&1 &
          ready=false
          # Ready also means every migration has been applied.
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5080/health/ready; then
              echo
              echo "API is ready."
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "The API did not become ready within 60 seconds."
            cat api.log
            exit 1
          fi
          bash ../scripts/smoke-api.sh http://127.0.0.1:5080 || { cat api.log; exit 1; }

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes
